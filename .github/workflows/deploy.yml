name: CI Pipeline

on:
  push:
    branches: [main]  # Запускать только при пуше в ветку main

jobs:
  checks:
    runs-on: ubuntu-latest  # Используем GitHub-hosted runner с Ubuntu

    steps:
      - uses: actions/checkout@v4  # Клонирует код из репозитория

      - name: Встановлення pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Встановлення Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Як локально (Node 24)
          cache: pnpm # Кешує залежності між запусками

      - name: Встановлення залежностей
        run: pnpm install --frozen-lockfile

      - name: Линтинг
        run: pnpm run lint:check

      - name: Запуск тестов
        run: pnpm run test

        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}


  deploy:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/myapp/backend
            git pull origin main
            cd /var/www/myapp
            docker compose up --build -d backend